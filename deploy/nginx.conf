# /etc/nginx/sites-available/qrnova → symlink into sites-enabled, then:  sudo certbot --nginx -d qr.example.com
# Certbot adds the HTTPS server block and the http→https redirect for you.
server {
    listen 80;
    listen [::]:80;
    server_name qr.example.com;

    client_max_body_size 300m;          # must be ≥ MAX_UPLOAD_MB

    location = /metrics { return 404; } # keep metrics private

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 300s;
    }
}